[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "epubkit"
version = "0.2.0"
description = "EPUB optimizer for e-ink readers (Xteink X4, X3, and others)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.30.0",
    "python-multipart==0.0.9",
    "pillow==10.4.0",
    "lxml==5.2.0",
    "cssutils==2.11.1",
    "aiofiles==24.1.0",
    "jinja2==3.1.4",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
epubkit-cli = "cli:main"

[tool.setuptools]
py-modules = [
    "app",
    "cli",
    "epub_packager",
    "epub_processor",
    "epub_structure",
    "html_cleaner",
    "image_processor",
    "metadata_handler",
    "presets",
    "text_cleaner",
]

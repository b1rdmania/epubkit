[build-system]
requires = ["setuptools>=61.0", "setuptools-rust>=1.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "epubkit"
version = "0.2.0"
description = "High-performance EPUB optimizer for E-ink readers"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.31",
    "pillow>=10.0.0",
    "lxml>=5.0.0",
    "cssutils>=2.11.0",
    "aiofiles>=24.1.0",
    "jinja2>=3.1.0",
]

[project.scripts]
epubkit = "cli:main"

[tool.setuptools]
packages = ["epubkit"]
py-modules = [
    "cli",
    "epub_processor",
    "image_processor",
    "html_cleaner",
    "text_cleaner",
    "epub_structure",
    "epub_packager",
    "metadata_handler",
    "app",
]

[[tool.setuptools-rust.ext-modules]]
target = "epubkit_rs"
path = "Cargo.toml"
binding = "PyO3"
